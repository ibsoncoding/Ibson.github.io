<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibson AI - Comme ChatGPT</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:#0f0f0f;color:#fff;display:flex;flex-direction:column;height:100vh}
header{padding:15px;text-align:center;background:#000;border-bottom:1px solid #222;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 15px;border-radius:18px;max-width:85%;line-height:1.4;white-space:pre-wrap}
.user{background:#007aff;align-self:flex-end;border-bottom-right-radius:4px}
.bot{background:#212121;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #333}
#box{display:flex;padding:12px;background:#000;gap:8px}
input{flex:1;padding:14px;border-radius:25px;border:1px solid #333;background:#1a1a1a;color:#fff;outline:none}
button{padding:0 20px;border-radius:25px;border:none;background:#007aff;color:#fff;font-weight:bold;cursor:pointer}
.typing{opacity:0.6;font-style:italic}
</style>
</head>
<body>
<header>🤖 Ibson AI - Ton ChatGPT Gratuit</header>
<div id="chat">
<div class="msg bot">Salut ! Je suis Ibson AI. Je suis codé par toi, je tourne sur ton site GitHub gratuitement. Pose-moi ce que tu veux !</div>
</div>
<div id="box">
<input id="inp" placeholder="Écris ton message..." onkeydown="if(event.key==='Enter') send()">
<button onclick="send()">↑</button>
</div>

<script>
const chatDiv = document.getElementById('chat');
const inp = document.getElementById('inp');

async function send(){
  let text = inp.value.trim();
  if(!text) return;
  chatDiv.innerHTML += `<div class="msg user">${text}</div>`;
  inp.value = "";
  chatDiv.scrollTop = chatDiv.scrollHeight;

  let id = Date.now();
  chatDiv.innerHTML += `<div class="msg bot typing" id="${id}">En train d'écrire...</div>`;
  chatDiv.scrollTop = chatDiv.scrollHeight;

  try{
    // API GRATUITE - Pas de clé, illimité pour test
    let res = await fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "openai",
        messages: [
          {role:"system", content:"Tu es Ibson AI, une IA créée par IbsonCoding. Tu es utile, amical, tu parles en français, tu réponds comme ChatGPT mais tu dis que tu es Ibson AI."},
          {role:"user", content: text}
        ]
      })
    });
    let data = await res.json();
    let reply = data.choices[0].message.content;
    document.getElementById(id).remove();
    chatDiv.innerHTML += `<div class="msg bot">${reply}</div>`;
  }catch(e){
    document.getElementById(id).innerHTML = "Erreur réseau. Réessaie, c'est gratuit donc parfois ça charge.";
  }
  chatDiv.scrollTop = chatDiv.scrollHeight;
}
</script>
</body>
</html>
