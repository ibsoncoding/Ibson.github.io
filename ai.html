<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibson AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/monokai.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:#0f0f0f;color:#fff;height:100dvh;display:flex;flex-direction:column}
header{padding:15px;text-align:center;background:#000;border-bottom:1px solid #222;font-weight:bold;position:fixed;top:0;left:0;right:0;z-index:10}
#chat{flex:1;overflow-y:auto;padding:70px 20px 90px 20px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 15px;border-radius:18px;max-width:92%;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.user{background:#007aff;align-self:flex-end;border-bottom-right-radius:4px}
.bot{background:transparent;align-self:flex-start;padding:0;border:none;max-width:95%}

/* EXACTEMENT COMME TA CAPTURE */
.code-wrapper{background:#000;border-radius:12px;overflow:hidden;margin:12px 0;border:1px solid #333;width:100%}
.code-header{display:flex;justify-content:space-between;align-items:center;background:#2f2f2f;padding:14px 18px}
.code-header span{color:#e8e8e8;font-size:16px;font-weight:500;letter-spacing:0.3px}
.copy-icon{background:transparent;border:none;cursor:pointer;color:#a0a0a0;padding:4px;border-radius:6px}
.copy-icon:hover{background:#444;color:#fff}
.copy-icon svg{width:22px;height:22px;fill:currentColor}
pre{margin:0 !important;background:#000 !important;border:none !important;border-top:1px solid #333 !important;border-radius:0 !important}
pre code{display:block;padding:16px !important;font-family:'Fira Code',Consolas,monospace !important;font-size:13.5px !important;background:transparent !important}

#box{position:fixed;bottom:0;left:0;right:0;display:flex;padding:12px;background:#000;border-top:1px solid #222;gap:8px;z-index:10}
input{flex:1;padding:14px;border-radius:25px;border:1px solid #333;background:#1a1a1a;color:#fff;outline:none}
button.send{padding:0 22px;border-radius:25px;border:none;background:#007aff;color:#fff;font-weight:bold;cursor:pointer;font-size:18px}
</style>
</head>
<body>
<header>Ibson AI</header>
<div id="chat">
<div class="msg bot" style="background:#212121;padding:12px 15px;border-radius:18px;border:1px solid #333;">Salut ! Tape "donne un code html" pour voir le bloc comme sur ta capture.</div>
</div>
<div id="box">
<input id="inp" placeholder="En quoi puis-je vous aider ?" onkeydown="if(event.key==='Enter') send()">
<button class="send" onclick="send()">↑</button>
</div>
<script>
const chatDiv = document.getElementById('chat');
const inp = document.getElementById('inp');

function copyCode(btn){
  let code = btn.closest('.code-wrapper').querySelector('code').innerText;
  navigator.clipboard.writeText(code);
  btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>`;
  setTimeout(()=> btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`, 1500);
}

function formatMessage(text){
  let escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  escaped = escaped.replace(/```(\w+)?\n?([\s\S]*?)```/g, (m, lang, code) => {
    let l = (lang || 'Html').trim();
    let label = "Code " + l.charAt(0).toUpperCase() + l.slice(1);
    return `<div class="code-wrapper"><div class="code-header"><span>${label}</span><button class="copy-icon" onclick="copyCode(this)"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button></div><pre><code class="language-${l.toLowerCase()}">${code.trim()}</code></pre></div>`;
  });
  return escaped;
}

async function send(){
  let text = inp.value.trim();
  if(!text) return;
  chatDiv.innerHTML += `<div class="msg user" style="background:#007aff;padding:12px 15px;border-radius:18px;align-self:flex-end;">${text}</div>`;
  inp.value = "";
  chatDiv.scrollTop = chatDiv.scrollHeight;
  let id = Date.now();
  chatDiv.innerHTML += `<div class="msg bot" id="${id}" style="background:#212121;padding:12px 15px;border-radius:18px;border:1px solid #333;opacity:0.6">En train d'écrire...</div>`;
  chatDiv.scrollTop = chatDiv.scrollHeight;
  try{
    let res = await fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "openai",
        messages: [
          {role:"system", content:"Tu es Ibson AI. Donne le code avec ```html"},
          {role:"user", content: text}
        ]
      })
    });
    let data = await res.json();
    let reply = data.choices[0].message.content;
    document.getElementById(id).remove();
    chatDiv.innerHTML += `<div class="msg bot">${formatMessage(reply)}</div>`;
    document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  }catch(e){
    document.getElementById(id).innerHTML = "Erreur réseau.";
  }
  chatDiv.scrollTop = chatDiv.scrollHeight;
}
</script>
</body>
</html>
